# 型・Lint・ビルドの検証と、GitHub Pages への配信。
# 検証はPRでも動く。配信は main への push のときだけ動く。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手動で流したいとき
  workflow_dispatch:

# 同じブランチへ続けてpushされたら古い実行は打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # 現時点のLTSで検証する。LTSが切り替わったら手動で上げる。
          node-version: 24
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 静的書き出し
        run: npm run build

      # _next/ はアンダースコア始まりのため、Jekyll に無視されると CSS も JS も 404 になる
      - name: .nojekyll を置く
        run: touch out/.nojekyll

      - name: 書き出し結果をアップロード
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
